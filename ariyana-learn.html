  const app=await new Response(stream).text();
  document.open(); document.write(app); document.close();
})().catch(err=>{
  document.body.innerHTML='<div style="padding:28px;max-width:650px;margin:auto"><h1>Ariyana Learn</h1><p>'+String(err.message||err)+'</p></div>';
});
</script>
</body>
</html>
